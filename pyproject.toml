[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm",
    "wheel",
    "cython",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "noiselab"
description = "Efficient algorithms for noise generation and analysis in Python."
authors = [
    {name = "Jonathan Kohler", email = "kohler.jonathan@gmail.com"},
]
maintainers = [
    {name = "Jonathan Kohler", email = "kohler.jonathan@gmail.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dynamic = ['version']

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy >= 1.23",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "pytest >= 7.2.2",
    "pre-commit",
]
notebooks = [
    "jupyter",
    "jupytext",
]

[project.urls]
source = "https://github.com/kohlerjl/python-noiselab"
download = "https://pypi.python.org/pypi/noiselab"

[tool.setuptools.packages.find]
where = ["src"] # Tells setuptools to look for packages inside the 'src' directory

[tool.setuptools_scm]
version_file = "src/noiselab/_version.py"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
required-version = ">=0.15.0"
target-version = "py39"

line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ANN",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "FA102",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D212",
    "N806",
    "N803",
    "SIM108",
    "ARG002",
    "PLR0913",
    "PLR0914",
    "PLR0917",
]
unfixable = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ANN003", "D101", "D103"]
"notebooks/*.py" = ["E501", "B018"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
